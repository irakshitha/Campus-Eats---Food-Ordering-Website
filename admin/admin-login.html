<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Login - CampusEats</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

    <div class="card login-container">
        <h2 style="text-align: center; margin-bottom: 20px;">Partner Login</h2>
        <div id="errorMsg" class="alert hidden"></div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label>Shop ID</label>
                <input type="text" id="shopId" placeholder="e.g. shop_g1" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn btn-secondary" style="width: 100%;">Access Dashboard</button>
        </form>

        <p style="text-align: center; margin-top: 15px;">
            <a href="../index.html" style="font-size: 0.9rem; color: #666;">Back to Home</a>
        </p>
    </div>

    <script src="../js/data.js"></script>
    <script>
        // Inline script for simple login logic
        document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const shopId = document.getElementById('shopId').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            if (ADMIN_CREDENTIALS[shopId] && ADMIN_CREDENTIALS[shopId] === password) {
                // Save Session
                const shop = DataManager.getShopDetails(shopId);
                if (shop) {
                    localStorage.setItem(DB_KEYS.CURRENT_ADMIN, JSON.stringify(shop));
                    window.location.href = 'dashboard.html';
                } else {
                    errorMsg.textContent = 'Invalid Shop ID Logic Error';
                    errorMsg.classList.remove('hidden');
                }
            } else {
                errorMsg.textContent = 'Invalid Credentials. Try shop_g1 / pass123';
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
