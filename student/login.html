<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - CampusEats</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/student.css">
</head>

<body>

    <div class="auth-container fade-in">
        <a href="../index.html" class="btn-back"
            style="position: absolute; top: 20px; left: 20px; border: none; box-shadow: var(--shadow-md);">←</a>
        <div class="auth-header">
            <h2>Welcome Back! 🎓</h2>
            <p>Log in to order your favorite campus food</p>
        </div>

        <div id="errorMsg" class="alert alert-error hidden"></div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="regNo">Registration Number</label>
                <input type="text" id="regNo" class="input-modern" placeholder="e.g. 21BCE1234" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">VIT Email</label>
                <input type="email" id="email" class="input-modern" placeholder="email@vitstudent.ac.in" required>
            </div>

            <button type="submit" class="btn btn-primary btn-large" style="width: 100%;">
                Login →
            </button>
        </form>

        <p style="margin-top: var(--space-6); text-align: center; font-size: var(--text-sm);">
            <a href="../index.html" class="text-muted">← Back to Home</a>
        </p>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/auth.js"></script>
</body>

</html>
